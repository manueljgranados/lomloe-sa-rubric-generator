<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Generador SA + Rúbricas</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      label { display:block; font-weight: 600; margin-top: 12px; }
      input, textarea { width: 100%; padding: 10px; }
      textarea { min-height: 90px; }
      .hint { color: #555; font-size: 0.9rem; }
      button { margin-top: 18px; padding: 10px 14px; cursor: pointer; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </head>
  <body>
    <h1>Generador de Situaciones de Aprendizaje (borrador)</h1>
    <p class="hint">
      MVP: genera un Markdown a partir de los campos. Separe listas con saltos de línea.
    </p>

    <form action="/generate" method="post">
      <div class="row">
        <div>
          <label>Nivel</label>
          <input name="nivel" placeholder="1º Bachillerato / 2º ESO / FP..." minlength="2" required />

          <label>Materia</label>
          <input name="materia" placeholder="Tecnología e Ingeniería I" minlength="3" required />

          <label>Título de la SA</label>
          <input name="titulo" placeholder="Diseño y prototipado de..." minlength="5" required />
        </div>

        <div>
          <label>Competencias (una por línea)</label>
          <textarea name="competencias" placeholder="CE1...\nCE2..." required></textarea>

          <label>Criterios de evaluación (uno por línea)</label>
          <textarea name="criterios" placeholder="C1...\nC2..." required></textarea>
        </div>
      </div>

      <label>Producto final</label>
      <textarea name="producto_final" minlength="10" required></textarea>

      <label>Metodología</label>
      <textarea name="metodologia" minlength="10" required></textarea>

      <label>Atención a la diversidad</label>
      <textarea name="atencion_diversidad" minlength="10" required></textarea>

      <label>Instrumentos de evaluación (uno por línea)</label>
      <textarea name="instrumentos_evaluacion" required></textarea>

      <label>Resumen (opcional, para portada)</label>
      <textarea name="resumen" minlength="20" placeholder="Resumen breve de la SA..."></textarea>

      <h2>Sesiones</h2>
      <p class="hint">Añada o elimine sesiones. Se enviarán como JSON al servidor.</p>

      <input type="hidden" id="sessions_json" name="sessions_json" />

      <div id="sessions"></div>

      <div style="display:flex; gap: 12px; margin-top: 12px;">
        <button type="button" id="addSession">Añadir sesión</button>
        <button type="button" id="removeSession">Eliminar última</button>
      </div>

      <button type="submit">Generar Markdown</button>

      <script>
        const sessionsEl = document.getElementById("sessions");
        const addBtn = document.getElementById("addSession");
        const removeBtn = document.getElementById("removeSession");
        const hiddenJson = document.getElementById("sessions_json");

        function sessionBlock(index) {
          const div = document.createElement("div");
          div.className = "session";
          div.style.border = "1px solid #ddd";
          div.style.padding = "12px";
          div.style.marginTop = "12px";

          div.innerHTML = `
            <h3>Sesión ${index}</h3>
            <label>Título</label>
            <input class="s_title" required minlength="3" value="Sesión X" />

            <label>Minutos</label>
            <input class="s_minutes" type="number" min="10" max="240" value="55" required />

            <label>Actividades</label>
            <textarea class="s_activities" required></textarea>

            <label>Evidencia</label>
            <input class="s_evidence" required />
          `;
          return div;
        }

        function renumber() {
          [...sessionsEl.querySelectorAll(".session")].forEach((div, i) => {
            div.querySelector("h3").textContent = `Sesión ${i + 1}`;
          });
        }

        function addSession() {
          const idx = sessionsEl.querySelectorAll(".session").length + 1;
          sessionsEl.appendChild(sessionBlock(idx));
        }

        function removeSession() {
          const blocks = sessionsEl.querySelectorAll(".session");
          if (blocks.length > 1) {
            blocks[blocks.length - 1].remove();
            renumber();
          }
        }

        // Inicial: 3 sesiones (como antes, pero dinámico)
        addSession(); addSession(); addSession();

        addBtn.addEventListener("click", addSession);
        removeBtn.addEventListener("click", removeSession);

        // Serializar antes de enviar
        document.querySelector("form").addEventListener("submit", () => {
          const sessions = [...sessionsEl.querySelectorAll(".session")].map(div => ({
            title: div.querySelector(".s_title").value.trim(),
            minutes: Number(div.querySelector(".s_minutes").value),
            activities: div.querySelector(".s_activities").value.trim(),
            evidence: div.querySelector(".s_evidence").value.trim(),
          }));
          hiddenJson.value = JSON.stringify(sessions);
        });
      </script>
    </form>

    <hr />
    <p class="hint">Healthcheck: <a href="/health">/health</a></p>
  </body>
</html>
